# Pudding-style night stage, shared with feelings/template.html.
# One deliberate dark theme: cream ink on warm near-black.
[theme]
base = "dark"
primaryColor = "#9a4fc6"
backgroundColor = "#191817"
secondaryBackgroundColor = "#24221f"
textColor = "#fffad7"
borderColor = "#3a3733"
linkColor = "#d795ff"
font = "'DM Sans', sans-serif"
headingFont = "'Young Serif', serif"
codeFont = "'DM Mono', monospace"
baseRadius = "full"
showSidebarBorder = false

[[theme.fontFaces]]
family = "DM Sans"
url = "https://fonts.gstatic.com/s/dmsans/v17/rP2tp2ywxg089UriI5-g4vlH9VoD8CmcqZG40F9JadbnoEwAopxRSW3w.woff"
weight = 400

